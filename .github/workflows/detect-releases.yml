name: Detect IB Gateway Releases

on:
  schedule:
    - cron: "0 8 * * *"

  workflow_dispatch:
    inputs:
      channel:
        description: "IB Gateway channel"
        type: choice
        options:
          - stable
          - latest
        required: true
      version:
        description: "IB Gateway version to build (e.g. 10.50.1g)"
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write
  packages: write

defaults:
  run:
    shell: "bash -Eeuo pipefail -x {0}"

jobs:
  detect-release:
    if: ${{ github.event_name != 'workflow_dispatch' || matrix.channel == inputs.channel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        channel: ["stable", "latest"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Get Version
        id: version
        env:
          CHANNEL: ${{ matrix.channel }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            build_version="$INPUT_VERSION"
          else
            res=$(curl -fsSL \
              "https://download2.interactivebrokers.com/installers/tws/${CHANNEL}-standalone/version.json" \
              | sed "s/tws${CHANNEL}_callback(//g;s/);//g")

            build_version=$(jq -r '.buildVersion' <<< "$res")
          fi

          if [ -z "$build_version" ] || [ "$build_version" = "null" ]; then
            echo "Unable to determine IB Gateway version"
            exit 1
          fi

          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"

      - name: Check if Release exists
        id: check-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ matrix.channel }}
          VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          release_tag="ibgateway-${CHANNEL}@${VERSION}"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download IB Gateway installer
        if: ${{ github.event_name == 'schedule' && steps.check-release.outputs.release_exists == 'false' }}
        env:
          CHANNEL: ${{ matrix.channel }}
          VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          download_url="https://download2.interactivebrokers.com/installers/ibgateway/${CHANNEL}-standalone/ibgateway-${CHANNEL}-standalone-linux-x64.sh"
          dest="ibgateway-${VERSION}-standalone-linux-x64.sh"

          curl -fsSL "$download_url" --output "$dest"
          sha256sum "$dest" > "${dest}.sha256"

      - name: Create Release
        if: ${{ github.event_name == 'schedule' && steps.check-release.outputs.release_exists == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ matrix.channel }}
          VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          release_tag="ibgateway-${CHANNEL}@${VERSION}"
          installer="ibgateway-${VERSION}-standalone-linux-x64.sh"

          gh release create "$release_tag" \
            -t "IB Gateway ${CHANNEL} ${VERSION}" \
            -n "IB Gateway ${CHANNEL} ${VERSION} release files" \
            "$installer" "${installer}.sha256"

      - name: Verify Release exists
        if: ${{ github.event_name == 'workflow_dispatch' && steps.check-release.outputs.release_exists == 'false' }}
        env:
          CHANNEL: ${{ matrix.channel }}
          VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          echo "Release ibgateway-${CHANNEL}@${VERSION} does not exist."
          echo "Manual build requires an existing GitHub Release with the installer."
          exit 1

      - name: Update Dockerfile
        env:
          CHANNEL: ${{ matrix.channel }}
          VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          ./update.sh "$CHANNEL" "$VERSION"

      - name: Check Dockerfile changes
        id: changes
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          if git diff --quiet -- "$CHANNEL"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.channel }}
          file: ./${{ matrix.channel }}/Dockerfile
          push: true
          tags: |
            ghcr.io/sucsessyan/ib-gateway:${{ steps.version.outputs.build_version }}-${{ matrix.channel }}
            ghcr.io/sucsessyan/ib-gateway:${{ matrix.channel }}

      - name: Create PR
        if: ${{ github.event_name == 'schedule' && steps.changes.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ matrix.channel }}
          VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          t_branch="update-${CHANNEL}-to-${VERSION}"

          git config user.name github-actions
          git config user.email github-actions@github.com

          git checkout -b "$t_branch"
          git add "$CHANNEL"
          git commit -m "Update ${CHANNEL} to ${VERSION}"
          git push --set-upstream origin "$t_branch"

          gh pr create \
            --base master \
            --head "$t_branch" \
            --title "Update ${CHANNEL} to ${VERSION}" \
            --body "Automated IB Gateway ${CHANNEL} update to version ${VERSION}."