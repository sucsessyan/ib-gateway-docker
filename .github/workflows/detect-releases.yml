name: Detect IB Gateway Releases

on:
  schedule:
    - cron: "0 8 * * *"

  workflow_dispatch:
    inputs:
      channel:
        description: "IB Gateway channel"
        type: choice
        options:
          - stable
          - latest
        required: true
      version:
        description: "IB Gateway version to build (e.g. 10.50.1g)"
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write
  packages: write

defaults:
  run:
    shell: "bash -Eeuo pipefail -x {0}"

jobs:
  detect-release:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        channel: ["stable", "latest"]

    steps:
      - uses: actions/checkout@v3
        with:
          ref: master

      - name: Skip channel
        if: ${{ github.event_name == 'workflow_dispatch' && matrix.channel != inputs.channel }}
        run: exit 0

      - name: Get Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            build_version="${{ inputs.version }}"
          else
            res=$(curl -fsSL "https://download2.interactivebrokers.com/installers/tws/${{ matrix.channel }}-standalone/version.json" \
              | sed 's/tws${{ matrix.channel }}_callback(//g;s/);//g')
            build_version=$(jq -r '.buildVersion' <<< "$res")
          fi

          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"

      - name: Check if Release exists
        id: check-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="ibgateway-${{ matrix.channel }}@${{ steps.version.outputs.build_version }}"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download IB Gateway installer
        if: ${{ github.event_name == 'schedule' && steps.check-release.outputs.release_exists == 'false' }}
        run: |
          download_url="https://download2.interactivebrokers.com/installers/ibgateway/${{ matrix.channel }}-standalone/ibgateway-${{ matrix.channel }}-standalone-linux-x64.sh"
          dest="ibgateway-${{ steps.version.outputs.build_version }}-standalone-linux-x64.sh"

          curl -fsSL "$download_url" --output "$dest"
          sha256sum "$dest" > "${dest}.sha256"

      - name: Create Release
        if: ${{ github.event_name == 'schedule' && steps.check-release.outputs.release_exists == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create 'ibgateway-${{ matrix.channel }}@${{ steps.version.outputs.build_version }}' \
            -t 'IB Gateway ${{ matrix.channel }} ${{ steps.version.outputs.build_version }}' \
            -n 'IB Gateway ${{ matrix.channel }} ${{ steps.version.outputs.build_version }} release files' \
            ibgateway-*.sh ibgateway-*.sha256

      - name: Verify Release exists
        if: ${{ github.event_name == 'workflow_dispatch' && steps.check-release.outputs.release_exists == 'false' }}
        run: |
          echo "Release ibgateway-${{ matrix.channel }}@${{ steps.version.outputs.build_version }} does not exist."
          echo "Manual build requires an existing GitHub Release with the installer."
          exit 1

      - name: Update Dockerfile
        run: ./update.sh ${{ matrix.channel }} ${{ steps.version.outputs.build_version }}

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: ${{ matrix.channel }}
          push: true
          tags: |
            ghcr.io/sucsessyan/ib-gateway:${{ steps.version.outputs.build_version }}-${{ matrix.channel }}
            ghcr.io/sucsessyan/ib-gateway:${{ matrix.channel }}

      - name: Create PR
        if: ${{ github.event_name == 'schedule' && steps.check-release.outputs.release_exists == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          t_branch="update-${{ matrix.channel }}-to-${{ steps.version.outputs.build_version }}"

          git config user.name github-actions
          git config user.email github-actions@github.com

          git checkout -b "$t_branch"
          git add "${{ matrix.channel }}"
          git commit -m "Update ${{ matrix.channel }} to ${{ steps.version.outputs.build_version }}"
          git push --set-upstream origin "$t_branch"

          gh pr create --base master --fill