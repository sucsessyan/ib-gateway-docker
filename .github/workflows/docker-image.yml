name: Docker Image CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get stable version
        id: version
        shell: bash
        run: |
          VERSION=$(git tag --list 'ibgateway-stable@*' --sort=-version:refname | head -n 1)
          VERSION=${VERSION#ibgateway-stable@}

          if [ -z "$VERSION" ]; then
            echo "No stable IB Gateway release tag found"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Stable version: $VERSION"

      - name: Set image name
        id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/ib-gateway"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./stable
          file: ./stable/Dockerfile
          push: ${{ github.event_name == 'push' }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            CHANNEL=stable
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}-stable
            ${{ steps.image.outputs.name }}:stable