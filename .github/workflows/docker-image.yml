name: Docker Image CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get stable version
        id: version
        run: |
          VERSION=$(git tag --list 'ibgateway-stable@*' --sort=-version:refname | head -n 1)
          VERSION=${VERSION#ibgateway-stable@}

          if [ -z "$VERSION" ]; then
            echo "No stable IB Gateway release tag found"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Stable version: $VERSION"

      - name: Build the Docker image
        run: |
          docker build ./stable \
            --file ./stable/Dockerfile \
            --build-arg VERSION="${{ steps.version.outputs.version }}" \
            --build-arg CHANNEL=stable \
            --tag ib-gateway:$(date +%s)